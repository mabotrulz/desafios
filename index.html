  setTimeout(function() {
    overlay.classList.add('evolving');
    sfxCorrect();
    document.getElementById('evoName').textContent = currentPoke.name + ' evoluiu para ' + currentEvo.name + '!';
    setTimeout(function() { speakMix([{en: currentEvo.name + '!'}]); }, 600);
    setTimeout(function() {
      overlay.classList.remove('active');
      overlay.classList.remove('evolving');
      // Both forms join the pokédex, and the evolved form becomes the fighter
      dexCaught[preFile] = Math.max(1, dexCaught[preFile] || 0);
      dexCaught[postFile] = (dexCaught[postFile] || 0) + 1;
      saveDex();
      setActivePoke(postFile);
      if (callback) callback();
    }, 2400);
  }, 2600);
}

function startFight(callback) {
    // The player keeps their active pokémon across fights (swapped via the pokédex,
    // evolved after each gym). Only captured pokémon can fight.
    if (!currentPoke) setActivePoke('pikachu.png');

    // Pick next opponent (shuffled bag, no repeats until exhausted)
    if (oppBag.length === 0) oppBag = shuffle(OPPONENTS.map((_, i) => i));
    let oppIdx = oppBag.pop();
    if (currentOpp && OPPONENTS[oppIdx].name === currentOpp.name && oppBag.length > 0) {
      const alt = oppBag.pop(); oppBag.push(oppIdx); oppIdx = alt;
    }
    currentOpp = OPPONENTS[oppIdx];

    pokeRocketIdx = 0;
    // Fresh scenery for every fight — full screen, behind everything.
    // The image layer is lifted by --floor-y so its painted floor line lands
    // exactly at the fighters' feet (arena bottom), not behind the number pad.
    const bgN = 1 + Math.floor(Math.random() * 6);
    const gameEl = document.querySelector('.game');
    const bgCss = 'linear-gradient(rgba(26,26,46,0.18), rgba(26,26,46,0.38)), url(assets/bg' + bgN + '.jpg), linear-gradient(180deg, #232342, #1a1a2e)';
    const bgSize = 'cover, cover, cover';
    const bgPos = 'center, center calc(100% - var(--floor-y, 0px)), center';
    gameEl.style.backgroundImage = bgCss;
    gameEl.style.backgroundSize = bgSize;
    gameEl.style.backgroundPosition = bgPos;
    document.body.style.backgroundImage = bgCss;
    document.body.style.backgroundSize = bgSize;
    document.body.style.backgroundPosition = bgPos;
    document.getElementById('arena').style.backgroundImage = '';
    requestAnimationFrame(() => requestAnimationFrame(updateFloorY));
    setPokeImage(currentPoke);
    buildOppRow();

    // Show Pokemon → speaks name. Then show opponent → speaks "contra {name}"
    showIntro('assets/' + currentPoke.file, currentPoke.name, 2200, function() {
      document.getElementById('pokeSide').style.opacity = '0';
      document.getElementById('rocketSide').style.opacity = '0';

      const overlay = document.getElementById('introOverlay');
      overlay.innerHTML = '';
      overlay.style.display = 'flex';
      overlay.style.flexDirection = 'column';
      overlay.style.alignItems = 'center';
      overlay.style.justifyContent = 'center';

      const row = document.createElement('div');
      row.style.display = 'flex';
      row.style.gap = 'clamp(2px, 1vw, 8px)';
      row.style.marginLeft = '-8px';
      row.style.alignItems = 'flex-end';
      row.style.marginBottom = '8px';

      currentOpp.imgs.forEach(function(f) {
        var img = document.createElement('img');
        img.src = 'assets/' + f;
        img.style.width = 'clamp(80px, 20vw, 150px)';
        img.style.height = 'clamp(80px, 20vw, 150px)';
        img.style.objectFit = 'contain';
        img.style.animation = 'introEntrance 0.5s ease forwards';
        img.style.marginRight = '-12px';
        row.appendChild(img);
      });
      overlay.appendChild(row);

      var nameEl = document.createElement('div');
      nameEl.className = 'intro-name';
      nameEl.textContent = currentOpp.name + '!';
      overlay.appendChild(nameEl);
      overlay.classList.add('active');

      // Speak "contra {name}!" now that they're visible.
      // The fight MUST start even if the speech engine drops the utterance:
      // iOS Safari often never fires onend/onerror after a cancel() race,
      // which used to leave the game stuck on this intro screen forever.
      var finishIntro = function() {
        if (finishIntro.done) return; finishIntro.done = true;
        clearTimeout(finishIntro._wd);
        overlay.classList.remove('active');
        setTimeout(function() {
          overlay.innerHTML = '<img class="intro-char" id="introImage" src="" alt=""><div class="intro-name" id="introName"></div>';
          overlay.style.display = '';
          overlay.style.flexDirection = '';
          overlay.style.alignItems = '';
          overlay.style.justifyContent = '';
        }, 400);
        document.getElementById('pokeSide').style.opacity = '1';
        document.getElementById('rocketSide').style.opacity = '1';
        if (callback) callback();
      };
      if (window.speechSynthesis) {
        var u = new SpeechSynthesisUtterance('contra ' + currentOpp.name + '!');
        u.lang = 'en-US'; u.rate = 0.85;
        u.onend = finishIntro;
        u.onerror = finishIntro;
        finishIntro._wd = setTimeout(finishIntro, 2600); // watchdog
        window.speechSynthesis.speak(u);
      } else {
        setTimeout(finishIntro, 1500);
      }
    });
  }

function loadRound() {
  isWin = false;
  if (phase === 1 && roundInPhase >= ROUNDS_PER_PHASE) { phase = 2; roundInPhase = 0; }

  document.getElementById('phaseDisplay').textContent = (phase === 1 ? '0-' : '10-') + currentMax();
  document.getElementById('roundDisplay').textContent = (roundInPhase + 1) + '/' + ROUNDS_PER_PHASE;

  // Fight won (evolution already happened right after the last attack) → next fight or win
  const gameDone = (phase === 2 && roundInPhase >= ROUNDS_PER_PHASE);
  if (pokeRocketIdx >= 3) {
    if (gameDone) { clearInterval(hintTimer); onWin(); }
    else startFight(() => { clearInterval(hintTimer); loadRound(); });
    return;
  }
  if (gameDone) { onWin(); return; }

  // Random challenge every round — números, contar, somar, sequência or letras
  presentChallenge(makeChallenge());
}

// Build slots + tile pool from a challenge (shared by normal rounds and capture challenges)
function buildChallenge(ch) {
  const slotsEl = document.getElementById('slotsContainer');
  slotsEl.innerHTML = '';
  ch.slots.forEach((d) => {
    const div = document.createElement('div');
    div.className = 'slot';
    div.dataset.expected = d;
    div.textContent = '';
    div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => {
      e.preventDefault(); div.classList.remove('drag-over');
      try { const v=e.dataTransfer.getData('text/plain'); if(v) handleNumberDrop(v,div,null); }catch(_){}
    });
    slotsEl.appendChild(div);
  });

  // Build pool
  const pool = document.getElementById('numPool');
  pool.innerHTML = '';
  ch.pool.forEach((n) => {
    const div = document.createElement('div');
    div.className = 'num-tile';
    div.draggable = true;
    div.textContent = n;
    div.dataset.value = n;
    div.dataset.used = 'false';

    div.addEventListener('dragstart', e => {
      if (div.dataset.used === 'true') { e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', String(n));
      div.classList.add('dragging');
    });
    div.addEventListener('dragend', () => div.classList.remove('dragging'));

    let tx, ty;
    div.addEventListener('touchstart', e => {
      if (div.dataset.used === 'true') return;
      const t = e.touches[0]; tx = t.clientX; ty = t.clientY;
      div.classList.add('dragging');
      dragData = { value: n, el: div };
      const ghost = document.getElementById('dragGhost');
      ghost.textContent = n; ghost.style.display='flex';
      ghost.style.left=t.clientX+'px'; ghost.style.top=t.clientY+'px';
    }, { passive: true });
    div.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      document.getElementById('dragGhost').style.left=t.clientX+'px';
      document.getElementById('dragGhost').style.top=t.clientY+'px';
    }, { passive: false });
    div.addEventListener('touchend', e => {
      div.classList.remove('dragging');
      document.getElementById('dragGhost').style.display='none';
      const t = e.changedTouches[0];
      const dx=t.clientX-tx, dy=t.clientY-ty;
      if (Math.abs(dx)<5&&Math.abs(dy)<5) return;
      if (dragData) {
        const slots = document.querySelectorAll('.slot:not(.filled)');
        for (const slot of slots) {
          const r = slot.getBoundingClientRect();
          if (t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom) {
            handleNumberDrop(dragData.value, slot, dragData.el); break;
          }
        }
      }
      dragData = null;
    }, { passive: true });
    div.addEventListener('click', () => {
      if (div.dataset.used === 'true') return;
      const slot = document.querySelector('.slot:not(.filled)');
      if (slot) handleNumberDrop(n, slot, div);
    });
    pool.appendChild(div);
  });
}

// Wrong answers teach: glow the right tile and explain WHY (voice + visual counting)
function teachWrong(slotEl) {
  const ch = currentChallenge; if (!ch) return;
  const expected = slotEl.dataset.expected;
  const tile = [...document.querySelectorAll('.num-tile')].find(t => t.dataset.value === expected && t.dataset.used === 'false');
  if (tile) { tile.classList.add('teach'); setTimeout(() => tile.classList.remove('teach'), 2800); }
  const items = [...document.querySelectorAll('#challengeQ .ci')];
  if ((ch.mode === 'contar' || ch.mode === 'somar') && items.length) {
    const total = ch.itemCount;
    const words = [];
    for (let i = 1; i <= total; i++) words.push(NUM_NAMES[i]);
    const intro = ch.mode === 'somar' ? 'Vamos contar todos juntos! ' : 'Vamos contar! ';
    speak(intro + words.join(', ') + '! São ' + NUM_NAMES[total] + '!');
    items.forEach((el, i) => {
      setTimeout(() => el.classList.add('lit'), 250 + i * 430);
      setTimeout(() => el.classList.remove('lit'), 250 + i * 430 + 400);
    });
  } else if (ch.mode === 'sequencia' && ch.seq) {
    speak('Olha: ' + ch.seq.map(x => NUM_NAMES[x]).join(', ') + '... vem o ' + NUM_NAMES[ch.ans] + '!');
  } else if (expected && isNaN(expected)) {
    const nome = LETTER_NAMES[expected] || expected;
    speak('Esta é a letra ' + nome + '! Toca na ' + nome + '!');
  } else {
    speak('Procura o número ' + NUM_NAMES[+expected] + '!');
  }
}

function handleNumberDrop(value, slotEl, sourceEl) {
  if (isWin || roadPuzzleActive || !slotEl || slotEl.classList.contains('filled')) return;
  const expected = slotEl.dataset.expected;
  value = String(value);

  if (value === expected) {
    slotEl.classList.add('filled');
    slotEl.textContent = value;
    slotsFilled++;

    if (sourceEl) { sourceEl.dataset.used='true'; sourceEl.classList.add('placed'); }
    else {
      document.querySelectorAll('.num-tile').forEach(el => {
        if (el.dataset.value===value && el.dataset.used==='false') { el.dataset.used='true'; el.classList.add('placed'); }
      });
    }

    sfxCorrect();
    score++;
    showFeedback('✅', 'ok');
    document.getElementById('scoreDisplay').textContent = score;
    // adaptive: reward streaks with a higher ceiling
    rightStreak++; wrongStreak = 0;
    if (rightStreak >= 4) { diffAdj = Math.min(2, diffAdj + 1); rightStreak = 0; }

    if (slotsFilled === totalSlots) {
      if (captureMode) setTimeout(runCaptureThrow, 300);
      else setTimeout(triggerPokemonAttack, 300);
    }
  } else {
    if (captureMode) { wildFlees(); return; }
    slotEl.classList.add('wrong');
    setTimeout(() => slotEl.classList.remove('wrong'), 400);
    sfxWrong();
    showFeedback('❌', 'fail');
    // adaptive: ease off after repeated misses, then teach
    wrongStreak++; rightStreak = 0;
    if (wrongStreak >= 2) { diffAdj = Math.max(-3, diffAdj - 1); wrongStreak = 0; }
    teachWrong(slotEl);
  }
}

// Phone rumble (Android Chrome/Firefox; iOS Safari ignores navigator.vibrate)
function rumble(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {} }

// ---------- Canvas attack FX engine (everything drawn, no emoji sprites) ----------
function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function runFx(render, duration) {
  const c = document.createElement('canvas');
  c.className = 'fx-canvas';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.round(window.innerWidth * dpr);
  c.height = Math.round(window.innerHeight * dpr);
  document.body.appendChild(c);
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = window.innerWidth, H = window.innerHeight, t0 = performance.now();
  (function frame(now) {
    const el = now - t0;
    ctx.clearRect(0, 0, W, H);
    render(ctx, W, H, el / 1000, Math.min(1, el / duration));
    if (el < duration) requestAnimationFrame(frame);
    else c.remove();
  })(t0);
}

function waveY(x, t, a1, f1, s1, a2, f2, s2) {
  return a1 * Math.sin(x * f1 + t * s1) + a2 * Math.sin(x * f2 - t * s2);
}

// One cohesive wall of flame with a noise-shaped front, rising bottom → top.
// Erupts on the enemy once the front reaches them.
function flameWall(pal, tx, ty) {
  return function(ctx, W, H, t, p) {
    const front = H + 60 - p * (H + 340);
    ctx.globalAlpha = p > 0.85 ? (1 - p) / 0.15 : 1;
    const body = ctx.createLinearGradient(0, front - 40, 0, H);
    body.addColorStop(0, pal.core);
    body.addColorStop(0.15, pal.mid);
    body.addColorStop(0.55, pal.edge);
    body.addColorStop(1, pal.deep);
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0, H + 2);
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, front + waveY(x, t, 22, 0.018, 6.5, 12, 0.043, 10));
    ctx.lineTo(W, H + 2);
    ctx.closePath();
    ctx.fill();
    // bright tongues licking above the front line
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 22; i++) {
      const x = ((i + 0.5) / 22) * W + Math.sin(i * 12.9898) * 22;
      const fl = 0.5 + 0.5 * Math.sin(t * 13 + i * 2.4);
      const base = front + waveY(x, t, 22, 0.018, 6.5, 12, 0.043, 10);
      const th = 30 + 70 * fl;
      const tg = ctx.createLinearGradient(0, base - th, 0, base);
      tg.addColorStop(0, 'rgba(255,255,255,0)');
      tg.addColorStop(1, pal.tongue);
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.ellipse(x, base - th * 0.45, 8 + 9 * fl, th * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // eruption where the wall engulfs the enemy
    if (front < ty) {
      const eng = Math.min(1, (ty - front) / 120);
      const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, 30 + 90 * eng);
      g.addColorStop(0, 'rgba(255,240,180,' + 0.9 * eng + ')');
      g.addColorStop(1, 'rgba(255,90,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(tx, ty, 30 + 90 * eng, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 6; i++) {
        const x = tx - 42 + i * 17;
        const fl = 0.6 + 0.4 * Math.sin(t * 15 + i * 2.1);
        const th = (36 + 44 * fl) * eng;
        const tg2 = ctx.createLinearGradient(0, ty - th, 0, ty + 8);
        tg2.addColorStop(0, 'rgba(255,255,220,0)');
        tg2.addColorStop(1, pal.tongue);
        ctx.fillStyle = tg2;
        ctx.beginPath();
        ctx.ellipse(x, ty - th * 0.4, 7 + 6 * fl, th * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  };
}

// One cohesive sheet of water with a foam crest, falling top → bottom.
// Splashes on the enemy when the surface reaches them.
function waterSheet(tx, ty) {
  return function(ctx, W, H, t, p) {
    const surf = -60 + p * (H + 320);
    ctx.globalAlpha = p > 0.85 ? (1 - p) / 0.15 : 1;
    const body = ctx.createLinearGradient(0, 0, 0, surf + 40);
    body.addColorStop(0, 'rgba(13,71,161,0.8)');
    body.addColorStop(0.65, 'rgba(41,152,240,0.85)');
    body.addColorStop(1, 'rgba(200,235,255,0.95)');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0, -2);
    ctx.lineTo(0, surf + waveY(0, t, 12, 0.02, 6, 6, 0.05, 9));
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, surf + waveY(x, t, 12, 0.02, 6, 6, 0.05, 9));
    ctx.lineTo(W, -2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let x = 0; x <= W; x += 10) {
      const y = surf + waveY(x, t, 12, 0.02, 6, 6, 0.05, 9) + 6;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // splash on the enemy when the sheet reaches them
    if (surf >= ty - 10) {
      const eng = Math.min(1, (surf - ty + 10) / 90);
      ctx.strokeStyle = 'rgba(255,255,255,' + 0.9 * eng + ')';
      for (let i = 0; i < 7; i++) {
        const a = -Math.PI * (0.15 + 0.7 * i / 6);
        const r = (30 + i * 9) * eng;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(tx, ty + 6);
        ctx.quadraticCurveTo(tx + Math.cos(a) * r * 0.6, ty + Math.sin(a) * r * 0.8,
                             tx + Math.cos(a) * r, ty + 6 + Math.sin(a) * r * 0.4 + r * 0.35);
        ctx.stroke();
      }
      const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, 60 * eng + 20);
      g.addColorStop(0, 'rgba(220,242,255,' + 0.7 * eng + ')');
      g.addColorStop(1, 'rgba(41,152,240,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(tx, ty, 60 * eng + 20, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
}

// Real jagged lightning bolts converging on the target + screen flash
function lightningStorm(tx, ty) {
  const bolts = [Math.random(), Math.random(), Math.random(), Math.random()];
  function boltPath(ctx, x0, y0, x1, y1, rough) {
    const segs = 14;
    ctx.moveTo(x0, y0);
    for (let i = 1; i < segs; i++) {
      const f = i / segs;
      ctx.lineTo(x0 + (x1 - x0) * f + (Math.random() - 0.5) * rough,
                 y0 + (y1 - y0) * f + (Math.random() - 0.5) * rough * 0.6);
    }
    ctx.lineTo(x1, y1);
  }
  return function(ctx, W, H, t, p) {
    const blink = Math.max(0, Math.sin(p * Math.PI * 4)) * 0.35 * (1 - p);
    ctx.fillStyle = 'rgba(255,255,200,' + blink + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = p < 0.75 ? 1 : (1 - p) / 0.25;
    bolts.forEach(function(seed, i) {
      if (Math.sin(t * 45 + seed * 40) < -0.55) return; // flicker
      const sx = seed * W, sy = -10;
      ctx.shadowColor = '#fff59d'; ctx.shadowBlur = 16;
      ctx.strokeStyle = 'rgba(159,139,255,0.85)'; ctx.lineWidth = 7;
      ctx.beginPath(); boltPath(ctx, sx, sy, tx, ty, 46); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.2;
      ctx.beginPath(); boltPath(ctx, sx, sy, tx, ty, 46); ctx.stroke();
      ctx.shadowBlur = 0;
    });
    ctx.globalAlpha = 1;
  };
}

// Concentric pulse rings — first centre is the enemy, the rest scatter (psychic / fairy / normal)
function pulseRings(c1, c2, tx, ty) {
  const centers = [{ x: tx / window.innerWidth, y: ty / window.innerHeight }];
  for (let i = 0; i < 2; i++) centers.push({ x: 0.25 + 0.4 * i + (Math.random() - 0.5) * 0.08, y: 0.25 + Math.random() * 0.5 });
  return function(ctx, W, H, t, p) {
    const maxR = Math.max(W, H) * 0.35;
    centers.forEach(function(cn, ci) {
      for (let k = 0; k < 4; k++) {
        const f = (p * 1.4 + k * 0.22 + ci * 0.1) % 1;
        ctx.globalAlpha = (1 - f) * (p > 0.85 ? (1 - p) / 0.15 : 1);
        ctx.strokeStyle = k % 2 ? c1 : c2;
        ctx.lineWidth = 5 - f * 3;
        ctx.shadowColor = c2; ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(cn.x * W, cn.y * H, f * maxR, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  };
}

function makeVerts(nv) {
  const v = [];
  for (let i = 0; i < nv; i++) {
    const a = (i / nv) * Math.PI * 2, r = 0.7 + Math.random() * 0.45;
    v.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return v;
}

function drawShape(ctx, kind, s, pal, verts, t) {
  if (kind === 'rock') {
    const g = ctx.createLinearGradient(-s, -s, s, s);
    g.addColorStop(0, pal.core); g.addColorStop(1, pal.edge);
    ctx.fillStyle = g; ctx.strokeStyle = pal.edge; ctx.lineWidth = 2;
    ctx.beginPath();
    verts.forEach(function(v, i) { if (i) ctx.lineTo(v[0] * s, v[1] * s); else ctx.moveTo(v[0] * s, v[1] * s); });
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (kind === 'snow') {
    ctx.strokeStyle = pal.mid; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.shadowColor = pal.core; ctx.shadowBlur = 8;
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(0, -s);
      ctx.moveTo(0, -s * 0.55); ctx.lineTo(s * 0.28, -s * 0.75);
      ctx.moveTo(0, -s * 0.55); ctx.lineTo(-s * 0.28, -s * 0.75);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  } else if (kind === 'leaf') {
    ctx.fillStyle = pal.mid; ctx.strokeStyle = pal.edge; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.quadraticCurveTo(s * 0.9, -s * 0.2, 0, s);
    ctx.quadraticCurveTo(-s * 0.9, -s * 0.2, 0, -s);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -s * 0.8); ctx.lineTo(0, s * 0.8); ctx.stroke();
  } else if (kind === 'bug') {
    ctx.fillStyle = pal.edge;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.55, s * 0.75, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = pal.mid;
    ctx.beginPath(); ctx.ellipse(0, -s * 0.15, s * 0.35, s * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    const w = 0.4 + 0.6 * Math.abs(Math.sin(t * 30));
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * w) + ')'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-s * 0.9, -s * 0.5 * w);
    ctx.moveTo(0, 0); ctx.lineTo(s * 0.9, -s * 0.5 * w);
    ctx.stroke();
  } else if (kind === 'spark') {
    ctx.fillStyle = pal.core; ctx.shadowColor = pal.mid; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.quadraticCurveTo(s * 0.16, -s * 0.16, s, 0);
    ctx.quadraticCurveTo(s * 0.16, s * 0.16, 0, s);
    ctx.quadraticCurveTo(-s * 0.16, s * 0.16, -s, 0);
    ctx.quadraticCurveTo(-s * 0.16, -s * 0.16, 0, -s);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// Shapes tumbling down from the top — half of them aimed onto the enemy (rocks, snowflakes, leaves, bugs, sparkles)
function rainShapes(kind, pal, n, tx) {
  const items = [];
  for (let i = 0; i < (n || 8); i++) items.push({
    x: (tx && i % 2 === 0) ? Math.min(0.97, Math.max(0.03, tx / window.innerWidth + (Math.random() - 0.5) * 0.12)) : Math.random(),
    delay: i * 0.06 + Math.random() * 0.08, speed: 0.85 + Math.random() * 0.5,
    rot: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 6,
    size: 13 + Math.random() * 15, sway: Math.random() * Math.PI * 2, verts: makeVerts(7)
  });
  return function(ctx, W, H, t, p) {
    items.forEach(function(it) {
      const f = (t - it.delay) * it.speed / 1.1;
      if (f < 0 || f > 1.15) return;
      ctx.save();
      ctx.translate(it.x * W + Math.sin(t * 2 + it.sway) * 14, -40 + f * (H + 120));
      ctx.rotate(it.rot + t * it.spin);
      drawShape(ctx, kind, it.size, pal, it.verts, t);
      ctx.restore();
    });
  };
}

// Glowing wisps rising with wavy tails + dark vignette (ghost / dark).
// The biggest wisp engulfs the enemy.
function ghostWisps(vig, core, mid, tail, tx, ty) {
  const wisps = [{
    x: Math.min(0.97, Math.max(0.03, tx / window.innerWidth)), speed: 1.0, size: 34,
    phase: 0, delay: 0, targetY: ty / window.innerHeight
  }];
  for (let i = 1; i < 7; i++) wisps.push({
    x: Math.random(), speed: 0.7 + Math.random() * 0.5, size: 16 + Math.random() * 18,
    phase: Math.random() * Math.PI * 2, delay: i * 0.08
  });
  return function(ctx, W, H, t, p) {
    ctx.fillStyle = vig + (0.28 * Math.sin(Math.min(1, p) * Math.PI)) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    wisps.forEach(function(w) {
      const f = (t - w.delay) * w.speed / 1.3;
      if (f < 0 || f > 1.1) return;
      const y = w.targetY ? (H + 40 - f * (H + 160 - (1 - w.targetY) * H)) : (H + 40 - f * (H + 160));
      const x = w.x * W + Math.sin(t * 3 + w.phase) * 26;
      const g = ctx.createRadialGradient(x, y, 0, x, y, w.size);
      g.addColorStop(0, core);
      g.addColorStop(0.5, mid);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, w.size, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = tail; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y + w.size * 0.5);
      for (let k = 1; k <= 6; k++) ctx.lineTo(x + Math.sin(t * 6 + w.phase + k) * 8, y + w.size * 0.5 + k * 9);
      ctx.stroke();
    });
    ctx.globalCompositeOperation = 'source-over';
  };
}

// Spinning vortex sweeping across the screen — flashes on the enemy as it passes (flying)
function vortex(tx, ty) {
  return function(ctx, W, H, t, p) {
    const cx = W * (1.15 - p * 1.3), cy = H * 0.5;
    ctx.globalAlpha = p > 0.85 ? (1 - p) / 0.15 : 1;
    for (let i = 0; i < 9; i++) {
      const f = i / 9;
      ctx.strokeStyle = 'rgba(236,244,255,' + (0.75 - f * 0.5) + ')';
      ctx.lineWidth = 6 - f * 3.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx + Math.sin(i * 3.3) * 12, cy, 30 + f * H * 0.45, t * 9 + i * 0.9, t * 9 + i * 0.9 + Math.PI * 0.9);
      ctx.stroke();
    }
    // impact flash as the vortex passes over the enemy
    const d = Math.abs(cx - tx);
    if (d < 110) {
      const eng = 1 - d / 110;
      ctx.strokeStyle = 'rgba(255,255,255,' + 0.9 * eng + ')';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(tx, ty, 20 + (1 - eng) * 60, 0, Math.PI * 2); ctx.stroke();
      const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, 70 * eng + 20);
      g.addColorStop(0, 'rgba(255,255,255,' + 0.6 * eng + ')');
      g.addColorStop(1, 'rgba(176,190,197,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(tx, ty, 70 * eng + 20, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
}

function star8(ctx, s) {
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const r = i % 2 ? s * 0.45 : s, a = (i / 16) * Math.PI * 2;
    if (i) ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

// Sequential impact starbursts — the first lands squarely on the enemy (fighting)
function starPunches(pal, n, tx, ty) {
  const pts = [{ x: tx / window.innerWidth, y: ty / window.innerHeight, at: 0 }];
  for (let i = 1; i < n; i++) pts.push({ x: 0.15 + Math.random() * 0.7, y: 0.2 + Math.random() * 0.55, at: i * 0.14 });
  return function(ctx, W, H, t, p) {
    pts.forEach(function(pt) {
      const f = (p - pt.at) / 0.18;
      if (f < 0 || f > 1) return;
      ctx.save();
      ctx.translate(pt.x * W, pt.y * H); ctx.rotate(f * 0.6);
      ctx.globalAlpha = 1 - f;
      ctx.fillStyle = pal.core; ctx.strokeStyle = pal.edge; ctx.lineWidth = 3;
      ctx.shadowColor = pal.mid; ctx.shadowBlur = 14;
      star8(ctx, 12 + f * 46);
      ctx.restore();
    });
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  };
}

function combineFx(list) {
  return function(ctx, W, H, t, p) { list.forEach(function(r) { r(ctx, W, H, t, p); }); };
}

// Epic full-screen attack FX for rare + 3rd-evolution pokémon — all custom drawn,
// and every one of them visibly strikes the enemy at (tx, ty)
function epicAttackFX(type, tx, ty) {
  let render;
  switch (type) {
    case 'fire':
      render = flameWall({ core:'rgba(255,246,200,0.95)', mid:'rgba(255,154,42,0.9)', edge:'rgba(255,77,0,0.8)', deep:'rgba(110,18,0,0.85)', tongue:'rgba(255,224,130,0.8)' }, tx, ty);
      break;
    case 'dragon':
      render = flameWall({ core:'rgba(215,255,242,0.95)', mid:'rgba(52,211,153,0.9)', edge:'rgba(15,118,110,0.85)', deep:'rgba(4,60,50,0.85)', tongue:'rgba(178,255,230,0.8)' }, tx, ty);
      break;
    case 'water':    render = waterSheet(tx, ty); break;
    case 'electric': render = lightningStorm(tx, ty); break;
    case 'psychic':  render = pulseRings('#e1bee7', '#ab47bc', tx, ty); break;
    case 'fairy':    render = combineFx([pulseRings('#ffd1ec', '#ff8fd6', tx, ty), rainShapes('spark', { core:'#fff0fa', mid:'#ff9fd8' }, 12, tx)]); break;
    case 'rock':     render = rainShapes('rock', { core:'#cfc4b5', edge:'#5d4037' }, 9, tx); break;
    case 'ground':   render = rainShapes('rock', { core:'#e6d3ae', edge:'#6d4c41' }, 10, tx); break;
    case 'steel':    render = rainShapes('rock', { core:'#eceff1', edge:'#546e7a' }, 8, tx); break;
    case 'ice':      render = rainShapes('snow', { core:'#ffffff', mid:'#b3e5fc' }, 12, tx); break;
    case 'grass':    render = rainShapes('leaf', { mid:'#7ed957', edge:'#2e7d32' }, 12, tx); break;
    case 'bug':      render = rainShapes('bug', { mid:'#aeea00', edge:'#33691e' }, 10, tx); break;
    case 'ghost':    render = ghostWisps('rgba(30,0,60,', 'rgba(216,180,255,0.9)', 'rgba(142,36,170,0.55)', 'rgba(186,104,200,0.5)', tx, ty); break;
    case 'dark':     render = ghostWisps('rgba(5,0,20,', 'rgba(120,90,220,0.85)', 'rgba(60,20,120,0.6)', 'rgba(90,50,160,0.5)', tx, ty); break;
    case 'flying':   render = vortex(tx, ty); break;
    case 'fighting': render = starPunches({ core:'#fff1e0', mid:'#ff9e66', edge:'#d84315' }, 5, tx, ty); break;
    default:         render = pulseRings('#fff3c8', '#ffd54f', tx, ty); break;
  }
  runFx(render, 1500);
}

// Small type-shaped projectile for regular pokémon — flame, droplet, spark, leaf, pebble…
const MINI_VERTS = [[1,0],[0.4,0.9],[-0.8,0.6],[-1,-0.3],[-0.2,-1],[0.7,-0.7]];
const TUMBLE_TYPES = { rock:1, ground:1, steel:1, ice:1, grass:1, bug:1, fairy:1, fighting:1 };

function drawMiniShape(ctx, type, s, t) {
  const P = TYPE_FX[type] || TYPE_FX.normal;
  if (type === 'fire' || type === 'dragon') {
    // little flame teardrop, flickering
    const fl = 0.85 + 0.3 * Math.sin(t * 25);
    ctx.shadowColor = P.mid; ctx.shadowBlur = 10;
    ctx.fillStyle = P.mid;
    ctx.beginPath();
    ctx.moveTo(0, -s * fl);
    ctx.quadraticCurveTo(s * 0.9, -s * 0.1, 0, s * 0.7);
    ctx.quadraticCurveTo(-s * 0.9, -s * 0.1, 0, -s * fl);
    ctx.fill();
    ctx.fillStyle = P.core;
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.55 * fl);
    ctx.quadraticCurveTo(s * 0.45, 0, 0, s * 0.45);
    ctx.quadraticCurveTo(-s * 0.45, 0, 0, -s * 0.55 * fl);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else if (type === 'water') {
    // droplet
    ctx.shadowColor = P.mid; ctx.shadowBlur = 8;
    ctx.fillStyle = P.mid;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.quadraticCurveTo(s * 0.85, 0, 0, s * 0.85);
    ctx.quadraticCurveTo(-s * 0.85, 0, 0, -s);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(-s * 0.2, s * 0.1, s * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (type === 'electric') {
    // mini zigzag bolt: thick yellow glow stroke + white core
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = P.mid; ctx.shadowBlur = 18;
    ctx.strokeStyle = P.mid; ctx.lineWidth = Math.max(5, s * 0.32);
    ctx.beginPath();
    ctx.moveTo(-s * 0.3, -s);
    ctx.lineTo(s * 0.25, -s * 0.25);
    ctx.lineTo(-s * 0.2, 0);
    ctx.lineTo(s * 0.3, s);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2.5, s * 0.14);
    ctx.stroke();
  } else if (type === 'ice') {
    drawShape(ctx, 'snow', s, { core: P.core, mid: P.mid }, null, t);
  } else if (type === 'grass') {
    drawShape(ctx, 'leaf', s, { mid: P.mid, edge: P.edge }, null, t);
  } else if (type === 'bug') {
    drawShape(ctx, 'bug', s, { mid: P.mid, edge: P.edge }, null, t);
  } else if (type === 'rock' || type === 'ground' || type === 'steel') {
    drawShape(ctx, 'rock', s, { core: P.core, edge: P.edge }, MINI_VERTS, t);
  } else if (type === 'fairy') {
    drawShape(ctx, 'spark', s, { core: P.core, mid: P.mid }, null, t);
  } else if (type === 'fighting') {
    ctx.fillStyle = P.core; ctx.strokeStyle = P.edge; ctx.lineWidth = 2;
    ctx.shadowColor = P.mid; ctx.shadowBlur = 10;
    star8(ctx, s);
    ctx.shadowBlur = 0;
  } else {
    // psychic / ghost / poison / dark / flying / normal: glowing orb
    ctx.shadowColor = P.mid; ctx.shadowBlur = 12;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
    g.addColorStop(0, P.core);
    g.addColorStop(0.6, P.mid);
    g.addColorStop(1, hexA(P.mid, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// Standard attack: two small type-shaped projectiles arc into the enemy — nothing full-screen
function projectileFX(type, x0, y0, x1, y1) {
  runFx(function(ctx, W, H, t, p) {
    [0, 0.09, 0.18, 0.27].forEach(function(off, gi) {
      const f = (t - off) / 0.58;
      if (f < 0 || f > 1) return;
      const x = x0 + (x1 - x0) * f;
      const y = y0 + (y1 - y0) * f + Math.sin(f * Math.PI) * -34;
      // trailing ghosts (bigger, brighter the closer to the head)
      if (gi > 0) {
        ctx.globalAlpha = 0.18 + gi * 0.08;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(0.5 + gi * 0.12, 0.5 + gi * 0.12);
        drawMiniShape(ctx, type, 30, t);
        ctx.restore();
        ctx.globalAlpha = 1;
        return;
      }
      // projectile head
      ctx.save();
      ctx.translate(x, y);
      if (TUMBLE_TYPES[type]) ctx.rotate(f * 5);
      drawMiniShape(ctx, type, 30, t);
      ctx.restore();
    });
  }, 900);
}

// Drawn impact starburst + ring where the attack lands
function impactBurstFX(type, x, y) {
  const P = TYPE_FX[type] || TYPE_FX.normal;
  runFx(function(ctx, W, H, t, p) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(p * 0.5);
    ctx.globalAlpha = 1 - p;
    ctx.fillStyle = P.core; ctx.strokeStyle = P.edge; ctx.lineWidth = 4;
    ctx.shadowColor = P.mid; ctx.shadowBlur = 24;
    star8(ctx, 22 + p * 70);
    ctx.restore();
    ctx.globalAlpha = (1 - p) * 0.9;
    ctx.strokeStyle = P.core; ctx.lineWidth = 5;
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(x, y, 14 + p * 110, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }, 550);
}

// DOM projectile: positioned inside #arena — exactly the same layout space as the
// characters, so it always starts AT the pokémon and lands ON the enemy.
function domProjectile(type, fromEl, toEl, onImpact) {
  const arena = document.getElementById('arena');
  const ar = arena.getBoundingClientRect();
  const fr = fromEl.getBoundingClientRect();
  const tr2 = toEl ? toEl.getBoundingClientRect() : null;
  const x0 = fr.left + fr.width / 2 - ar.left, y0 = fr.top + fr.height / 2 - ar.top;
  const x1 = tr2 ? tr2.left + tr2.width / 2 - ar.left : ar.width * 0.8;
  const y1 = tr2 ? tr2.top + tr2.height / 2 - ar.top : ar.height * 0.4;
  const el = document.createElement('div');
  el.className = 'proj';
  el.textContent = TYPE_EMOJI[type] || '⭐';
  arena.appendChild(el);
  const dur = 580, t0 = performance.now();
  (function step(now) {
    const f = Math.min(1, (now - t0) / dur);
    const x = x0 + (x1 - x0) * f;
    const y = y0 + (y1 - y0) * f - Math.sin(f * Math.PI) * 30;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = 'translate(-50%,-50%) scale(' + (1 + f * 0.4) + ')';
    if (f < 1) requestAnimationFrame(step);
    else { el.remove(); if (onImpact) onImpact(); }
  })(t0);
}

function domImpact(toEl) {
  const arena = document.getElementById('arena');
  const ar = arena.getBoundingClientRect();
  const tr2 = toEl ? toEl.getBoundingClientRect() : null;
  const el = document.createElement('div');
  el.className = 'impact-pop';
  el.textContent = '💥';
  el.style.left = (tr2 ? tr2.left + tr2.width / 2 - ar.left : ar.width * 0.8) + 'px';
  el.style.top = (tr2 ? tr2.top + tr2.height / 2 - ar.top : ar.height * 0.4) + 'px';
  arena.appendChild(el);
  setTimeout(() => el.remove(), 550);
}

function triggerPokemonAttack() {
  // Multi-type pokémon use a random type on each attack
  const types = (currentPoke.types && currentPoke.types.length) ? currentPoke.types : ['normal'];
  const type = types[Math.floor(Math.random() * types.length)];
  const fx = TYPE_FX[type] || TYPE_FX.normal;
  const pokeImg = document.getElementById('pokeImg');
  const arena = document.getElementById('arena');
  const target = document.getElementById('oppMember' + pokeRocketIdx);

  // Clear old hint when attack starts
  clearInterval(hintTimer);
  sfxBlast();

  const pr = pokeImg.getBoundingClientRect();
  const tr = target ? target.getBoundingClientRect() : null;
  const fromX = pr.left + pr.width / 2, fromY = pr.top + pr.height / 2;
  const toX = tr ? tr.left + tr.width / 2 : fromX + 220;
  const toY = tr ? tr.top + tr.height / 2 : fromY;

  // Every attack: a DOM projectile flies from the pokémon to the enemy (guaranteed
  // alignment — same layout space). Epic (3rd-evolution) pokémon then erupt their
  // full-screen custom FX on impact.
  const isEpic = EPIC_FILES.has(currentPoke.file);
  domProjectile(type, pokeImg, target, function() {
    domImpact(target);
    arena.classList.add('shake');
    setTimeout(() => arena.classList.remove('shake'), 420);
    if (Math.random() < 0.4) setTimeout(celebrate, 300);
    if (isEpic) {
      epicAttackFX(type, toX, toY);
      rumble([50, 40, 50, 40, 50, 40, 120]);
      setTimeout(() => rumble([40, 30, 40, 30, 90]), 500);
    }
  });
  rumble([25, 35, 25]);

  // Attacker lunges with its type animation
  pokeImg.className = 'char-img poke-img ' + fx.cls;
  setTimeout(() => { pokeImg.className = 'char-img poke-img'; }, 600);

  // One opponent member gets hit and blasts off
  if (target) {
    setTimeout(() => target.classList.add('hit'), 600);
    setTimeout(() => {
      target.classList.remove('hit');
      target.classList.add('blast');
    }, 900);
  }

  pokeRocketIdx++;

  // Gym defeated → evolution celebration, then the wild encounter (grass stage)
  setTimeout(pokeRocketIdx >= 3 ? gymDefeatedFlow : proceedNextRound, 1800);
}

// ---------- Celebration variety: 4 rotating win moments ----------
function confettiFX() {
  const pieces = [];
  const colors = ['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb','#ffab40'];
  for (let i = 0; i < 60; i++) pieces.push({
    x: Math.random(), y: -0.1 - Math.random() * 0.3, r: 4 + Math.random() * 5,
    c: colors[i % 6], vy: 0.35 + Math.random() * 0.4,
    vx: (Math.random() - 0.5) * 0.2, rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 8
  });
  runFx(function(ctx, W, H, t) {
    pieces.forEach(pc => {
      const x = (pc.x + pc.vx * t) * W, y = (pc.y + pc.vy * t) * H;
      if (y > H + 20) return;
      ctx.save(); ctx.translate(x, y); ctx.rotate(pc.rot + pc.vr * t);
      ctx.fillStyle = pc.c; ctx.fillRect(-pc.r / 2, -pc.r / 2, pc.r, pc.r * 0.6);
      ctx.restore();
    });
  }, 1900);
}

function starBurstFX() {
  runFx(function(ctx, W, H, t, p) {
    const cx = W / 2, cy = H * 0.35;
    for (let i = 0; i < 16; i++) {
      const ang = (i / 16) * Math.PI * 2 + t * 0.6;
      const d = p * W * 0.32;
      const x = cx + Math.cos(ang) * d, y = cy + Math.sin(ang) * d * 0.7;
      ctx.globalAlpha = 1 - p;
      ctx.fillStyle = i % 2 ? '#ffd740' : '#fff9c4';
      ctx.beginPath(); ctx.arc(x, y, 6 * (1 - p) + 2, 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }, 900);
}

function celebrate() {
  const kind = Math.floor(Math.random() * 4);
  if (kind === 0) confettiFX();
  else if (kind === 1) starBurstFX();
  else if (kind === 2) {
    const b = document.createElement('div');
    b.className = 'celebrate-ball'; b.textContent = '🔴';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1500);
  } else {
    const img = document.getElementById('pokeImg');
    if (img) { img.classList.add('celebrate'); setTimeout(() => img.classList.remove('celebrate'), 1700); }
  }
}

function gymDefeatedFlow() {
  storyGymWon();
  setTimeout(celebrate, 700);
  // Story panel gets its moment before the evolution/wild overlays take over
  setTimeout(() => {
    if (currentEvo) runEvolution(function() { startWildEncounter(); });
    else startWildEncounter();
  }, 2600);
}

function onWin() {

function restartGame() {

  gameStartedFlag = true;

  }, 4400);
}

// ---------- Story arc: thieves stole the village's 6 Pokébolas ----------
const TOTAL_BALLS = 6; // 20 rounds ÷ 3 rounds per gym = 6 full gyms per game
let ballsRecovered = 0;

function updateBallsHud() {
  const hud = document.getElementById('ballsHud');
  if (!hud) return;
  hud.innerHTML = '';
  for (let i = 0; i < TOTAL_BALLS; i++) {
    const s = document.createElement('span');
    s.className = 'pb' + (i < ballsRecovered ? ' got' : '');
    hud.appendChild(s);
  }
}

let storyToastTimer = null;
function showStory(text) {
  const t = document.getElementById('storyToast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(storyToastTimer);
  storyToastTimer = setTimeout(() => t.classList.remove('show'), 4200);
}

// Storybook panel: AI-generated scene + caption, tap-to-skip, auto-dismiss
let storyPanelTimer = null;
function showStoryPanel(img, caption, ms) {
  ms = ms || 4200;
  document.getElementById('storyPanelImg').src = 'assets/' + img;
  document.getElementById('storyPanelCaption').textContent = caption;
  document.getElementById('storyPanel').classList.add('active');
  clearTimeout(storyPanelTimer);
  storyPanelTimer = setTimeout(hideStoryPanel, ms);
}
function hideStoryPanel() {
  clearTimeout(storyPanelTimer);
  document.getElementById('storyPanel').classList.remove('active');
}

function storyGymWon() {
  ballsRecovered = Math.min(TOTAL_BALLS, ballsRecovered + 1);
  updateBallsHud();
  const pb = document.querySelectorAll('#ballsHud .pb')[ballsRecovered - 1];
  if (pb) pb.classList.add('pop');
  const falta = TOTAL_BALLS - ballsRecovered;
  const line = falta > 0
    ? 'Recuperaste uma Pokébola! ' + (falta === 1 ? 'Só falta uma!' : 'Faltam ' + falta + '!')
    : 'Recuperámos todas as Pokébolas!';
  showStoryPanel('story_recover.jpg', '🔴 ' + line, 3000);
  speak(line);
}

function showFeedback(msg, type) {
  const el = document.getElementById('feedbackMsg');
  el.textContent = msg; el.className = 'msg ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 800);
}

// Initialize - set images immediately, then start game
function setPokeImage(poke) {
  document.getElementById('pokeImg').src = 'assets/' + poke.file;
  document.getElementById('pokeName').textContent = poke.name;
}

// Start overlay
function startGame() {
  document.getElementById('startOverlay').classList.add('hidden');
  initAudio();
  oppBag = [];
  gameStartedFlag = true;
  ballsRecovered = 0; updateBallsHud();
  // Story kickoff: panel first, then the fight intro begins
  showStoryPanel('story_intro.jpg', 'Os ladrões roubaram as 6 Pokébolas da aldeia! Ganha batalhas para as recuperar!', 4600);
  speak('Os ladrões roubaram as Pokébolas da aldeia! Ajuda o teu Pokémon a recuperá-las todas!');
  setTimeout(() => {
    startFight(() => {
      phase = 1; roundInPhase = 0; score = 0;
      document.getElementById('winOverlay').classList.remove('active');
      loadRound();
    });
  }, 4800);
}

// Set images on page load (hidden until start) — the player always begins with Pikachu
setActivePoke('pikachu.png');
updateBallsHud();
document.getElementById('storyPanel').addEventListener('click', hideStoryPanel);
currentOpp = OPPONENTS[0];
buildOppRow();

// Wild encounter + pokédex buttons
document.getElementById('ballBtn').addEventListener('click', function() { useMasterBall = false; startCaptureChallenge(); });
document.getElementById('masterBallBtn').addEventListener('click', function() { if (masterBalls > 0) { useMasterBall = true; startCaptureChallenge(); } });
document.getElementById('wildSkip').addEventListener('click', endWildEncounter);
document.getElementById('dexClose').addEventListener('click', closeDex);
document.getElementById('dexHudBtn').addEventListener('click', openDex);
document.getElementById('pokeSide').addEventListener('click', openDex);
document.getElementById('dexDetail').addEventListener('click', function(e) {
  if (e.target === this) closeDexDetail();
});
</script>
